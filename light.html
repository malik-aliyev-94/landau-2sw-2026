<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Little Red Riding Hood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #fef5e4;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Floating petals ── */
    #petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      animation: drift var(--dur, 10s) ease-in-out infinite;
    }
    @keyframes drift {
      0%,100% { transform: translateY(0) rotate(0deg);   opacity: .55; }
      50%      { transform: translateY(-22px) rotate(200deg); opacity: .25; }
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 44px 20px 20px;
    }
    .hero-img {
      display: block;
      width: clamp(180px, 44vw, 72vw);
      margin: 0 auto 14px;
      animation: float 3.5s ease-in-out infinite;
      filter: drop-shadow(0 10px 28px rgba(200,80,50,.22));
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.2rem, 9vw, 4.5rem);
      line-height: 1.05;
      color: #c0392b;
      text-shadow: 3px 3px 0 #f4a261, 5px 5px 0 rgba(0,0,0,.07);
      margin-bottom: 8px;
    }
    .subtitle {
      color: #8b5e3c;
      font-size: .93rem;
      margin-top: 5px;
      font-style: italic;
    }

    /* ── Hint bar ── */
    .hint {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 10px 20px;
      background: rgba(255,255,255,.8);
      border: 1.5px solid rgba(196,130,60,.22);
      border-radius: 40px;
      color: #7a4a1e;
      font-size: .88rem;
      backdrop-filter: blur(6px);
      max-width: 480px;
      margin: 0 auto 28px;
      box-shadow: 0 2px 12px rgba(200,120,50,.1);
    }

    /* ── Story ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px 140px;
    }

    /* ── Scene dividers ── */
    .scene {
      text-align: center;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #b07040;
      margin: 34px 0 14px;
    }
    .scene::before, .scene::after { content: ' ✦ '; color: #e63946; }

    /* ── Cards ── */
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      border-radius: 20px;
      padding: 16px 80px 16px 20px;
      margin-bottom: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background: #fff;
      box-shadow: 0 2px 10px rgba(180,100,40,.12), 0 1px 3px rgba(0,0,0,.05);
      scroll-margin-bottom: 90px;
    }
    /* colored left accent bar */
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      border-radius: 20px 0 0 20px;
      background: var(--cc, #e63946);
    }
    .card:active { transform: scale(.97); }
    .card.playing {
      animation: glow-light .55s ease-in-out infinite alternate;
    }
    @keyframes glow-light {
      from { box-shadow: 0 2px 10px rgba(180,100,40,.12); transform: scale(1); }
      to   { box-shadow: 0 8px 30px rgba(230,57,70,.24);  transform: scale(1.02); }
    }

    /* ── Speaker button ── */
    .btn {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--cs, rgba(230,57,70,.1));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: background .2s;
    }
    .card.playing .btn { animation: bump .55s ease-in-out infinite alternate; }
    @keyframes bump {
      from { transform: scale(1); }
      to   { transform: scale(1.18); }
    }

    /* ── Text ── */
    .text {
      flex: 1;
      font-size: clamp(.98rem, 3.5vw, 1.18rem);
      font-weight: 800;
      line-height: 1.55;
      color: #2d1b00;
    }

    /* ── Child badge ── */
    .badge {
      position: absolute;
      top: 9px;
      right: 13px;
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--cc, #e63946);
      opacity: .85;
    }

    .card.played::after {
      content: '✓';
      position: absolute;
      bottom: 7px;
      right: 12px;
      font-size: .68rem;
      color: rgba(100,70,40,.35);
    }

    /* ── Divider trees ── */
    .trees {
      text-align: center;
      font-size: 1.5rem;
      margin: 6px 0 18px;
      opacity: .5;
      letter-spacing: .15em;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 16px 20px 36px;
      color: rgba(100,70,40,.45);
      font-size: .82rem;
    }

    /* ── Child avatar ── */
    #avatar {
      position: fixed;
      right: 14px;
      top: -80px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: top .45s cubic-bezier(.34,1.4,.64,1),
                  border-color .3s ease,
                  opacity .3s ease;
    }
    #avatar.visible { opacity: 1; }
    #avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @media (min-width: 520px) {
      .card { gap: 18px; }
      .btn  { width: 54px; height: 54px; font-size: 1.5rem; }
    }
    @media (min-width: 820px) {
      .card { padding: 20px 26px; }
    }

    /* ── Gallery ── */
    #gallery-section {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px 140px;
    }
    .gallery-header {
      text-align: center;
      padding: 48px 0 8px;
    }
    .gallery-header h2 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      color: #c0392b;
      text-shadow: 2px 2px 0 #f4a261, 3px 3px 0 rgba(0,0,0,.05);
    }
    .gallery-header p {
      color: #8b5e3c;
      font-size: .9rem;
      font-style: italic;
      margin-top: 6px;
    }
    .gallery-divider {
      text-align: center;
      font-size: 1.4rem;
      opacity: .45;
      letter-spacing: .2em;
      margin: 18px 0 20px;
    }
    #gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 480px) {
      #gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    }
    .g-item {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1;
      cursor: pointer;
      background: rgba(0,0,0,.05);
      box-shadow: 0 4px 18px rgba(180,100,40,.16), 0 1px 4px rgba(0,0,0,.07);
      transition: transform .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
      border: 3px solid #fff;
    }
    .g-item:active { transform: scale(.94); }
    @media (hover: hover) {
      .g-item:hover { transform: scale(1.04); box-shadow: 0 10px 32px rgba(180,100,40,.26); }
    }
    .g-item img,
    .g-item video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .g-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.22);
      pointer-events: none;
    }
    .g-play-circle {
      width: 52px;
      height: 52px;
      background: rgba(198,40,40,.88);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      padding-left: 4px;
      box-shadow: 0 4px 18px rgba(198,40,40,.45);
    }
    .g-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 6px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,.5));
      color: rgba(255,255,255,.9);
      font-size: .68rem;
      font-weight: 700;
      line-height: 1.35;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(20,10,0,.92);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #lightbox.open { display: flex; }
    #lb-media {
      max-width: min(92vw, 720px);
      max-height: 78vh;
      border-radius: 14px;
      display: block;
      object-fit: contain;
    }
    #lb-video {
      max-width: min(92vw, 720px);
      max-height: 78vh;
      border-radius: 14px;
      display: none;
      outline: none;
    }
    #lb-caption {
      color: rgba(255,255,255,.65);
      font-size: .86rem;
      margin-top: 14px;
      text-align: center;
      min-height: 1.2em;
      padding: 0 56px;
    }
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.16);
      border: none;
      color: #fff;
      font-size: 1.7rem;
      width: 46px; height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 510;
      backdrop-filter: blur(6px);
      transition: background .15s;
    }
    .lb-nav:hover { background: rgba(255,255,255,.28); }
    #lb-prev { left: 10px; }
    #lb-next { right: 10px; }
    #lb-close {
      position: fixed;
      top: 14px; right: 14px;
      background: rgba(255,255,255,.16);
      border: none;
      color: #fff;
      font-size: 1.3rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 510;
      backdrop-filter: blur(6px);
      transition: background .15s;
    }
    #lb-close:hover { background: rgba(255,255,255,.28); }

    /* ── Player bar ── */
    #player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 300;
      background: rgba(255,249,238,.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(200,140,80,.2);
      padding: 0 16px env(safe-area-inset-bottom);
      box-shadow: 0 -4px 24px rgba(180,100,40,.1);
    }
    #pb-idle {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0;
    }
    #pb-play-btn {
      background: linear-gradient(135deg,#e63946,#c0392b);
      border: none;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 1.22rem;
      letter-spacing: .05em;
      padding: 13px 44px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(230,57,70,.38);
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #pb-play-btn:active { transform: scale(.95); box-shadow: 0 2px 8px rgba(230,57,70,.3); }
    #pb-active {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    #pb-info { flex: 1; min-width: 0; }
    #pb-child {
      display: block;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    #pb-text {
      display: block;
      font-size: .82rem;
      font-weight: 700;
      color: #7a4a1e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pb-num {
      flex-shrink: 0;
      font-size: .7rem;
      font-weight: 900;
      color: rgba(120,80,40,.5);
      white-space: nowrap;
    }
    #pb-toggle-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(230,57,70,.1);
      color: #c0392b;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    #pb-toggle-btn:active { background: rgba(230,57,70,.2); }
  </style>
</head>
<body>

<div id="petals"></div>

<header>
  <img class="hero-img" src="images/intro.png" alt="Little Red Riding Hood">
  <h1>Little Red<br>Riding Hood</h1>
  <p class="subtitle">An interactive story</p>
  <p class="subtitle">LANDAU School &middot; Class 2SW &middot; 2026</p>
</header>

<div style="margin: 0 14px;">
  <p class="hint">👆 Tap a sentence to hear it read aloud!</p>
</div>

<main id="story"></main>

<footer>🌟 The End 🌟</footer>

<section id="gallery-section">
  <div class="gallery-header">
    <h2>📸 Behind the Scenes</h2>
    <p>The children who brought the story to life</p>
  </div>
  <div class="gallery-divider">🌸 🌺 🌸</div>
  <div id="gallery-grid"></div>
</section>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close">✕</button>
  <img id="lb-media" alt="">
  <video id="lb-video" controls playsinline></video>
  <p id="lb-caption"></p>
  <button class="lb-nav" id="lb-prev">&#8249;</button>
  <button class="lb-nav" id="lb-next">&#8250;</button>
</div>

<!-- Player bar -->
<div id="player-bar">
  <div id="pb-idle">
    <button id="pb-play-btn">&#9654;&nbsp;&nbsp;Play Story</button>
  </div>
  <div id="pb-active">
    <div id="pb-info">
      <span id="pb-child"></span>
      <span id="pb-text"></span>
    </div>
    <span id="pb-num"></span>
    <button id="pb-toggle-btn">&#10074;&#10074;</button>
  </div>
</div>

<div id="avatar"><img id="avatarImg" alt=""></div>

<script>
const SENTENCES = [
  { scene: "Once upon a time…",      text: "Little Red Riding Hood lived in a wood with her mother.",                child: "Omer",      type: "narrative", pitch: 1.4,  rate: 1.0  },
  { scene: null,                     text: "One day Little Red Riding Hood went to visit her granny.",               child: "Araz",      type: "narrative", pitch: 1.2,  rate: 1.0  },
  { scene: null,                     text: "She had a nice cake in her basket.",                                     child: "Javid",     type: "narrative", pitch: 1.5,  rate: 1.1  },
  { scene: null,                     text: "On her way Little Red Riding Hood met a wolf.",                          child: "Omer",      type: "narrative", pitch: 1.1,  rate: 0.95 },
  { scene: "In the deep forest…",    text: "“Hello! Where are you going?”",                                child: "Araz",      type: "wolf",      pitch: 0.8,  rate: 0.9  },
  { scene: null,                     text: "“I’m going to see my grandmother.”",                      child: "Amina",     type: "lrrh",      pitch: 1.6,  rate: 1.05 },
  { scene: null,                     text: "“She lives in a house behind those trees.”",                   child: "Ayan",      type: "lrrh",      pitch: 1.5,  rate: 1.0  },
  { scene: "At Granny’s cottage…", text: "The wolf ran to Granny’s house and ate Granny up.",        child: "Javid",     type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: null,                     text: "He got into Granny’s bed.",                                         child: "Omer",      type: "narrative", pitch: 1.4,  rate: 1.0  },
  { scene: null,                     text: "A little later, Little Red Riding Hood reached the house.",              child: "Omer",      type: "narrative", pitch: 1.15, rate: 1.0  },
  { scene: null,                     text: "She looked at the wolf.",                                                child: "Araz",      type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: "The big bad wolf…", text: "“Granny, what big eyes you have!”",                            child: "Amina",     type: "lrrh",      pitch: 1.7,  rate: 1.1  },
  { scene: null,                     text: "“All the better to see you with!” said the wolf.",             child: "Javid",     type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                     text: "“Granny, what big ears you have!”",                            child: "Ayan",      type: "lrrh",      pitch: 1.65, rate: 1.1  },
  { scene: null,                     text: "“All the better to hear you with!” said the wolf.",            child: "Omer",      type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                     text: "“Granny, what a big nose you have!”",                          child: "Amina",     type: "lrrh",      pitch: 1.7,  rate: 1.0  },
  { scene: null,                     text: "“All the better to smell you with!” said the wolf.",           child: "Araz",      type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                     text: "“Granny, what big teeth you have!”",                           child: "Ayan",      type: "lrrh",      pitch: 1.6,  rate: 0.95 },
  { scene: null,                     text: "“All the better to eat you with!” shouted the wolf.",          child: "Javid",     type: "wolf",      pitch: 0.7,  rate: 0.85 },
  { scene: "The rescue!",            text: "A woodcutter was in the wood.",                                          child: "Omer",      type: "narrative", pitch: 1.2,  rate: 1.05 },
  { scene: null,                     text: "He heard a loud scream and ran to the house.",                           child: "Araz",      type: "narrative", pitch: 1.1,  rate: 1.0  },
  { scene: null,                     text: "The woodcutter hit the wolf over the head.",                             child: "Javid",     type: "narrative", pitch: 1.45, rate: 1.1  },
  { scene: null,                     text: "The wolf opened his mouth wide and shouted and Granny jumped out.",      child: "Araz",      type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: "Happily ever after…", text: "The wolf ran away and Little Red Riding Hood never saw the wolf again.", child: "Javid",  type: "narrative", pitch: 1.5,  rate: 1.0  },
];

/* Pastel child styles — bg card tint, accent color, soft button fill */
const CHILD_STYLES = {
  Ayan:  { bg: '#fff0f6', color: '#d81b60', soft: 'rgba(216,27,96,.1)'   },
  Omer:  { bg: '#f0f6ff', color: '#1565c0', soft: 'rgba(21,101,192,.1)'  },
  Araz:  { bg: '#fff6f0', color: '#e65100', soft: 'rgba(230,81,0,.1)'    },
  Javid: { bg: '#f2fff4', color: '#2e7d32', soft: 'rgba(46,125,50,.1)'   },
  Amina: { bg: '#f8f0ff', color: '#6a1fa2', soft: 'rgba(106,31,162,.1)'  },
};

/* ── Floating petals ── */
(function() {
  const wrap = document.getElementById('petals');
  const palette = ['#ffb7c5','#ffd6a5','#b5ead7','#c9b4e3','#ffd966','#aee8f8'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const w = Math.random() * 14 + 7;
    const h = w * (.55 + Math.random() * .35);
    const br = Math.random() > .5 ? '50% 0 50% 0' : '0 50% 0 50%';
    p.style.cssText = [
      `width:${w}px`, `height:${h}px`,
      `top:${Math.random() * 65}%`,
      `left:${Math.random() * 100}%`,
      `background:${palette[i % palette.length]}`,
      `border-radius:${br}`,
      `--dur:${(Math.random() * 6 + 8).toFixed(1)}s`,
      `animation-delay:${(Math.random() * 7).toFixed(1)}s`,
    ].join(';');
    wrap.appendChild(p);
  }
})();

/* ── Build story cards ── */
const CARDS = [];
(function() {
  const story = document.getElementById('story');
  SENTENCES.forEach((s, i) => {
    if (s.scene) {
      if (i > 0) {
        const t = document.createElement('div');
        t.className = 'trees';
        t.textContent = '🌸 🌺 🌸';
        story.appendChild(t);
      }
      const sc = document.createElement('div');
      sc.className = 'scene';
      sc.textContent = s.scene;
      story.appendChild(sc);
    }

    const cs   = CHILD_STYLES[s.child] || { bg: '#fff', color: '#e63946', soft: 'rgba(230,57,70,.1)' };
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = i;
    card.style.background = cs.bg;
    card.style.setProperty('--cc', cs.color);
    card.style.setProperty('--cs', cs.soft);

    card.innerHTML = `
      <div class="btn"><span class="btn-icon">🔊</span></div>
      <div class="text">${s.text}</div>
      <div class="badge">${s.child}</div>
    `;
    card.addEventListener('click', () => {
      if (card === currentCard) { togglePlayPause(); return; }
      playFrom(i);
    });
    story.appendChild(card);
    CARDS.push(card);
  });
})();

/* ── Playback ── */
let currentAudio = null, currentCard = null, currentIdx = -1;
let isPlaying = false, isPaused = false;

const avatar    = document.getElementById('avatar');
const avatarImg = document.getElementById('avatarImg');
let _seq = 0;

function scrollThenAvatar(card, child, color) {
  const seq = ++_seq;
  avatarImg.src = `photos/${child.toLowerCase()}.jpg`;
  avatarImg.alt = child;
  avatar.style.borderColor = color;
  avatar.classList.remove('visible');

  const barH  = document.getElementById('player-bar').offsetHeight || 72;
  const availH = window.innerHeight - barH;
  const cr     = card.getBoundingClientRect();
  window.scrollTo({ top: Math.max(0, window.scrollY + cr.top - availH / 2 + cr.height / 2), behavior: 'smooth' });

  const place = () => {
    if (seq !== _seq) return;
    const r = card.getBoundingClientRect();
    avatar.style.top = `${r.top + r.height / 2 - 31}px`;
    avatar.classList.add('visible');
  };
  if ('onscrollend' in window) window.addEventListener('scrollend', place, { once: true });
  setTimeout(place, 500);
}

function stopAll() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentCard)  { currentCard.classList.remove('playing'); currentCard = null; }
  currentIdx = -1; isPlaying = false; isPaused = false;
  avatar.classList.remove('visible');
  updateBar();
}

function playFrom(idx) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentCard)  { currentCard.classList.remove('playing'); currentCard = null; }
  isPlaying = true; isPaused = false;
  playIndex(idx);
}

function togglePlayPause() {
  if (isPlaying && currentAudio) {
    currentAudio.pause();
    if (currentCard) currentCard.classList.remove('playing');
    isPlaying = false; isPaused = true;
    updateBar();
  } else if (isPaused && currentAudio) {
    if (currentCard) currentCard.classList.add('playing');
    isPlaying = true; isPaused = false;
    currentAudio.play();
    updateBar();
  }
}

function playIndex(idx) {
  if (idx >= SENTENCES.length || !isPlaying) {
    isPlaying = false; isPaused = false; currentIdx = -1;
    if (currentCard) { currentCard.classList.remove('playing'); currentCard = null; }
    currentAudio = null;
    avatar.classList.remove('visible');
    updateBar(); return;
  }
  currentIdx = idx;
  const card = CARDS[idx], s = SENTENCES[idx];
  if (currentCard && currentCard !== card) currentCard.classList.remove('playing');
  currentCard = card;
  card.classList.add('playing');
  scrollThenAvatar(card, s.child, (CHILD_STYLES[s.child] || {}).color || '#e63946');

  const audio = new Audio(`audio/sentence_${String(idx + 1).padStart(2, '0')}.mp3`);
  const advance = () => {
    if (audio !== currentAudio) return;
    card.classList.remove('playing');
    card.classList.add('played');
    currentAudio = null; currentCard = null;
    if (isPlaying) playIndex(idx + 1);
  };
  audio.onended = advance;
  audio.onerror = advance;
  audio.play();
  currentAudio = audio;
  updateBar();
}

function updateBar() {
  const idle     = document.getElementById('pb-idle');
  const active   = document.getElementById('pb-active');
  const pbChild  = document.getElementById('pb-child');
  const pbNum    = document.getElementById('pb-num');
  const pbText   = document.getElementById('pb-text');
  const pbToggle = document.getElementById('pb-toggle-btn');
  if ((isPlaying || isPaused) && currentIdx >= 0) {
    idle.style.display = 'none'; active.style.display = 'flex';
    const s = SENTENCES[currentIdx];
    pbChild.textContent = s.child;
    pbChild.style.color = (CHILD_STYLES[s.child] || {}).color || '#e63946';
    pbNum.textContent   = `${currentIdx + 1} / ${SENTENCES.length}`;
    const t = s.text;
    pbText.textContent  = t.length > 52 ? t.slice(0, 50) + '…' : t;
    pbToggle.innerHTML  = isPlaying ? '&#10074;&#10074;' : '&#9654;';
  } else {
    idle.style.display = 'flex'; active.style.display = 'none';
  }
}

document.getElementById('pb-play-btn').addEventListener('click', () => playFrom(0));
document.getElementById('pb-toggle-btn').addEventListener('click', togglePlayPause);
updateBar();

/* ── Gallery ── */
const GALLERY_ITEMS = [
  { type: 'photo', src: 'gallery/photo_01.jpg',  caption: '' },
  { type: 'photo', src: 'gallery/photo_02.jpg',  caption: '' },
  { type: 'photo', src: 'gallery/photo_03.jpg',  caption: '' },
  { type: 'photo', src: 'gallery/photo_001.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_002.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_003.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_004.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_005.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_006.jpg', caption: '' },
  { type: 'video', src: 'gallery/video_01.mp4',  caption: '' },
  { type: 'video', src: 'gallery/video_02.mp4',  caption: '' },
  { type: 'video', src: 'gallery/video_03.mp4',  caption: '' },
];

(function() {
  const grid    = document.getElementById('gallery-grid');
  const section = document.getElementById('gallery-section');
  if (!GALLERY_ITEMS.length) { section.style.display = 'none'; return; }

  GALLERY_ITEMS.forEach((item, i) => {
    const el  = document.createElement('div');
    el.className = 'g-item';
    const cap = item.caption ? `<div class="g-caption">${item.caption}</div>` : '';
    if (item.type === 'video') {
      el.innerHTML = `<video src="${item.src}" muted playsinline preload="metadata" style="pointer-events:none"></video>
        <div class="g-play"><div class="g-play-circle">&#9654;</div></div>${cap}`;
      const vid = el.querySelector('video');
      vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.001; });
    } else {
      el.innerHTML = `<img src="${item.src}" alt="${item.caption || ''}" loading="lazy">${cap}`;
    }
    el.addEventListener('click', () => openLightbox(i));
    grid.appendChild(el);
  });
})();

/* ── Lightbox ── */
let lbIndex = 0;
const lightbox = document.getElementById('lightbox');
const lbMedia  = document.getElementById('lb-media');
const lbVideo  = document.getElementById('lb-video');
const lbCap    = document.getElementById('lb-caption');

function openLightbox(i) {
  lbIndex = i; showLbItem();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  lbVideo.pause(); lbVideo.src = ''; lbMedia.src = '';
}

function showLbItem() {
  const item = GALLERY_ITEMS[lbIndex];
  lbCap.textContent = item.caption || '';
  lbVideo.pause();
  if (item.type === 'video') {
    lbMedia.style.display = 'none'; lbVideo.style.display = 'block';
    lbVideo.src = item.src; lbVideo.load();
  } else {
    lbVideo.style.display = 'none'; lbMedia.style.display = 'block';
    lbMedia.src = item.src;
  }
  document.getElementById('lb-prev').style.visibility = lbIndex > 0 ? 'visible' : 'hidden';
  document.getElementById('lb-next').style.visibility = lbIndex < GALLERY_ITEMS.length - 1 ? 'visible' : 'hidden';
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; showLbItem(); } });
document.getElementById('lb-next').addEventListener('click', () => { if (lbIndex < GALLERY_ITEMS.length - 1) { lbIndex++; showLbItem(); } });
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft'  && lbIndex > 0)                        { lbIndex--; showLbItem(); }
  if (e.key === 'ArrowRight' && lbIndex < GALLERY_ITEMS.length - 1) { lbIndex++; showLbItem(); }
});
</script>
