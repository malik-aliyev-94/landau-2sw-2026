<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Little Red Riding Hood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #fffde7;
      background-image: radial-gradient(circle, rgba(0,0,0,.12) 1px, transparent 1px);
      background-size: 22px 22px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Floating stars ── */
    #sparks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .spark {
      position: absolute;
      font-size: var(--sz, 1.2rem);
      line-height: 1;
      opacity: var(--op, .45);
      animation: spin var(--dur, 8s) linear infinite;
      color: var(--col, #e63946);
    }
    @keyframes spin {
      from { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.3); }
      to   { transform: rotate(360deg) scale(1); }
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 20px 18px;
    }
    .hero-img {
      display: block;
      width: clamp(170px, 42vw, 68vw);
      margin: 0 auto 14px;
      border: 4px solid #000;
      box-shadow: 7px 7px 0 #000;
      border-radius: 16px;
      animation: float 3s ease-in-out infinite;
      background: #fff;
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-10px) rotate(1deg); }
    }
    .title-wrap {
      display: inline-block;
      background: #e63946;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 8px 24px 4px;
      margin-bottom: 14px;
      transform: rotate(-1.5deg);
    }
    h1 {
      font-family: 'Bangers', cursive;
      font-size: clamp(2.4rem, 10vw, 5rem);
      line-height: 1;
      color: #fff;
      letter-spacing: .06em;
      text-shadow: 3px 3px 0 rgba(0,0,0,.35);
    }
    .subtitle {
      display: inline-block;
      background: #ffe100;
      border: 2.5px solid #000;
      box-shadow: 3px 3px 0 #000;
      color: #000;
      font-size: .85rem;
      font-weight: 900;
      padding: 3px 14px;
      margin-top: 4px;
      letter-spacing: .04em;
    }
    .subtitle + .subtitle { margin-left: 6px; }

    /* ── Hint ── */
    .hint {
      position: relative;
      z-index: 1;
      text-align: center;
      margin: 0 auto 28px;
      padding: 10px 20px;
      background: #fff;
      border: 2.5px solid #000;
      box-shadow: 4px 4px 0 #000;
      border-radius: 8px;
      color: #000;
      font-size: .88rem;
      font-weight: 800;
      max-width: 440px;
    }

    /* ── Story ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px 140px;
    }

    /* ── Scene dividers ── */
    .scene-wrap {
      text-align: center;
      margin: 36px 0 16px;
    }
    .scene {
      display: inline-block;
      background: #ffe100;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 6px 22px 4px;
      font-family: 'Bangers', cursive;
      font-size: 1.15rem;
      letter-spacing: .1em;
      color: #000;
      text-transform: uppercase;
      transform: rotate(-1.2deg);
    }

    /* ── Cards ── */
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      border-radius: 10px;
      padding: 16px 78px 16px 18px;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
      background: #fff;
      border: 3px solid #000;
      box-shadow: 5px 5px 0 #000;
      transition: transform .1s ease, box-shadow .1s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      scroll-margin-bottom: 90px;
    }
    /* alternating tilt */
    .card:nth-child(odd)  { transform: rotate(-0.5deg); }
    .card:nth-child(even) { transform: rotate(0.5deg);  }

    /* colored top strip */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: var(--cc, #e63946);
      border-radius: 7px 7px 0 0;
    }
    .card:active {
      transform: rotate(0deg) scale(.97) !important;
      box-shadow: 2px 2px 0 #000;
    }
    .card.playing {
      border-color: var(--cc, #e63946);
      box-shadow: 6px 6px 0 var(--cc, #e63946);
      animation: wiggle .45s ease-in-out infinite alternate;
    }
    @keyframes wiggle {
      from { transform: rotate(-0.8deg) scale(1); }
      to   { transform: rotate(0.8deg)  scale(1.015); }
    }

    /* ── Speaker button ── */
    .btn {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--cc, #e63946);
      border: 2.5px solid #000;
      box-shadow: 3px 3px 0 #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: box-shadow .1s, transform .1s;
    }
    .card.playing .btn {
      animation: bump .45s ease-in-out infinite alternate;
    }
    @keyframes bump {
      from { transform: scale(1); }
      to   { transform: scale(1.2); }
    }

    /* ── Text ── */
    .text {
      flex: 1;
      font-size: clamp(.95rem, 3.4vw, 1.15rem);
      font-weight: 800;
      line-height: 1.5;
      color: #111;
    }

    /* ── Badge ── */
    .badge {
      position: absolute;
      top: 10px;
      right: 11px;
      font-family: 'Bangers', cursive;
      font-size: .78rem;
      letter-spacing: .1em;
      background: var(--cc, #e63946);
      color: #fff;
      padding: 1px 8px;
      border: 2px solid #000;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .card.played::after {
      content: '✓';
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: .72rem;
      font-weight: 900;
      color: rgba(0,0,0,.3);
    }

    /* ── Comic strip separator ── */
    .strip-sep {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 20px;
      opacity: .55;
    }
    .strip-sep::before, .strip-sep::after {
      content: '';
      flex: 1;
      height: 3px;
      background: #000;
    }
    .strip-sep span {
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      letter-spacing: .15em;
      color: #000;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 16px 20px 36px;
    }
    .footer-inner {
      display: inline-block;
      background: #e63946;
      border: 3px solid #000;
      box-shadow: 5px 5px 0 #000;
      padding: 8px 28px 6px;
      font-family: 'Bangers', cursive;
      font-size: 1.5rem;
      letter-spacing: .12em;
      color: #fff;
      transform: rotate(1deg);
    }

    /* ── Avatar ── */
    #avatar {
      position: fixed;
      right: 14px;
      top: -80px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: top .45s cubic-bezier(.34,1.4,.64,1), opacity .3s ease;
    }
    #avatar.visible { opacity: 1; }
    #avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @media (min-width: 520px) {
      .card { gap: 18px; }
      .btn  { width: 52px; height: 52px; font-size: 1.4rem; }
    }
    @media (min-width: 820px) {
      .card { padding: 20px 26px; }
    }

    /* ── Gallery ── */
    #gallery-section {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px 140px;
    }
    .gallery-header {
      text-align: center;
      padding: 48px 0 10px;
    }
    .gallery-title-wrap {
      display: inline-block;
      background: #0057ff;
      border: 3px solid #000;
      box-shadow: 5px 5px 0 #000;
      padding: 6px 24px 4px;
      transform: rotate(1.2deg);
      margin-bottom: 8px;
    }
    .gallery-header h2 {
      font-family: 'Bangers', cursive;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: #fff;
      letter-spacing: .08em;
    }
    .gallery-header p {
      font-weight: 800;
      color: #000;
      font-size: .9rem;
      margin-top: 10px;
    }
    .gallery-divider {
      text-align: center;
      font-family: 'Bangers', cursive;
      font-size: 1.3rem;
      letter-spacing: .3em;
      color: #000;
      opacity: .4;
      margin: 16px 0 20px;
    }
    #gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 480px) {
      #gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    }
    .g-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1;
      cursor: pointer;
      border: 3px solid #000;
      box-shadow: 5px 5px 0 #000;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
      background: #ddd;
    }
    .g-item:nth-child(3n+1) { transform: rotate(-0.8deg); }
    .g-item:nth-child(3n+2) { transform: rotate(0.6deg); }
    .g-item:nth-child(3n)   { transform: rotate(-0.4deg); }
    .g-item:active {
      transform: rotate(0deg) scale(.93) !important;
      box-shadow: 2px 2px 0 #000;
    }
    @media (hover: hover) {
      .g-item:hover {
        transform: rotate(0deg) scale(1.05) !important;
        box-shadow: 8px 8px 0 #000;
        z-index: 2;
      }
    }
    .g-item img,
    .g-item video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .g-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,225,0,.25);
      pointer-events: none;
    }
    .g-play-circle {
      width: 52px;
      height: 52px;
      background: #ffe100;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #000;
      padding-left: 4px;
    }
    .g-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 6px 8px;
      background: rgba(255,225,0,.9);
      border-top: 2px solid #000;
      color: #000;
      font-size: .68rem;
      font-weight: 900;
    }

    /* ── Full-width YouTube embed ── */
    .yt-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 3px solid #000;
      box-shadow: 6px 6px 0 #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      cursor: pointer;
      background: #000;
    }
    .yt-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .yt-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .yt-play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .yt-play-circle {
      width: 72px;
      height: 72px;
      background: #ffe100;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #000;
      transition: transform .1s, box-shadow .1s;
    }
    .yt-wrap:hover .yt-play-circle {
      transform: scale(1.1);
      box-shadow: 6px 6px 0 #000;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.9);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #lightbox.open { display: flex; }
    #lb-media {
      max-width: min(92vw, 720px);
      max-height: 78vh;
      border-radius: 6px;
      display: block;
      object-fit: contain;
      border: 3px solid #fff;
    }
    #lb-video {
      max-width: min(92vw, 720px);
      max-height: 78vh;
      border-radius: 6px;
      display: none;
      outline: none;
      border: 3px solid #fff;
    }
    #lb-caption {
      color: #ffe100;
      font-weight: 900;
      font-size: .86rem;
      margin-top: 14px;
      text-align: center;
      min-height: 1.2em;
      padding: 0 56px;
    }
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: #ffe100;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      color: #000;
      font-size: 1.5rem;
      font-weight: 900;
      width: 46px; height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 510;
      transition: transform .1s;
    }
    .lb-nav:active { transform: translateY(-50%) scale(.9); }
    #lb-prev { left: 10px; }
    #lb-next { right: 10px; }
    #lb-close {
      position: fixed;
      top: 14px; right: 14px;
      background: #e63946;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 900;
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 510;
    }

    /* ── Player bar ── */
    #player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 300;
      background: #ffe100;
      border-top: 3px solid #000;
      padding: 0 16px env(safe-area-inset-bottom);
      box-shadow: 0 -4px 0 #000;
    }
    #pb-idle {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0;
    }
    #pb-play-btn {
      background: #e63946;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 1.3rem;
      letter-spacing: .1em;
      padding: 11px 40px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
      -webkit-tap-highlight-color: transparent;
    }
    #pb-play-btn:active {
      transform: translate(3px,3px);
      box-shadow: 1px 1px 0 #000;
    }
    #pb-active {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    #pb-info { flex: 1; min-width: 0; }
    #pb-child {
      display: block;
      font-family: 'Bangers', cursive;
      font-size: .82rem;
      letter-spacing: .12em;
      margin-bottom: 2px;
      color: #000;
    }
    #pb-text {
      display: block;
      font-size: .82rem;
      font-weight: 700;
      color: rgba(0,0,0,.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pb-num {
      flex-shrink: 0;
      font-family: 'Bangers', cursive;
      font-size: .82rem;
      letter-spacing: .06em;
      color: rgba(0,0,0,.55);
      white-space: nowrap;
    }
    #pb-toggle-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      background: #fff;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .1s, box-shadow .1s;
      -webkit-tap-highlight-color: transparent;
    }
    #pb-toggle-btn:active {
      transform: translate(2px,2px);
      box-shadow: 1px 1px 0 #000;
    }
  </style>
</head>
<body>

<div id="sparks"></div>

<header>
  <img class="hero-img" src="images/intro.png" alt="Little Red Riding Hood">
  <div style="margin-top:14px;">
    <div class="title-wrap">
      <h1>Little Red<br>Riding Hood</h1>
    </div>
  </div>
  <div style="margin-top:10px;">
    <span class="subtitle">An Interactive Story</span>
    <span class="subtitle">LANDAU · Class 2SW · 2026</span>
  </div>
</header>

<div style="margin: 0 14px;">
  <p class="hint">👆 Tap a panel to hear it read aloud!</p>
</div>

<main id="story"></main>

<footer>
  <div class="footer-inner">★ THE END ★</div>
</footer>

<section id="gallery-section">
  <div class="gallery-header">
    <div class="gallery-title-wrap">
      <h2>📸 Behind the Scenes</h2>
    </div>
    <p>The children who brought the story to life</p>
  </div>
  <div class="gallery-divider">★ ★ ★</div>
  <div class="yt-wrap" id="yt-facade">
    <img class="yt-thumb" src="https://img.youtube.com/vi/dTgqSgS9r5g/maxresdefault.jpg" alt="Video preview">
    <div class="yt-play-btn"><div class="yt-play-circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="6,3 21,12 6,21" fill="#000"/></svg></div></div>
  </div>
  <div id="gallery-grid"></div>
</section>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close">✕</button>
  <img id="lb-media" alt="">
  <video id="lb-video" controls playsinline></video>
  <p id="lb-caption"></p>
  <button class="lb-nav" id="lb-prev">&#8249;</button>
  <button class="lb-nav" id="lb-next">&#8250;</button>
</div>

<!-- Player bar -->
<div id="player-bar">
  <div id="pb-idle">
    <button id="pb-play-btn">▶ &nbsp;PLAY STORY</button>
  </div>
  <div id="pb-active">
    <div id="pb-info">
      <span id="pb-child"></span>
      <span id="pb-text"></span>
    </div>
    <span id="pb-num"></span>
    <button id="pb-toggle-btn">&#10074;&#10074;</button>
  </div>
</div>

<div id="avatar"><img id="avatarImg" alt=""></div>

<script>
const SENTENCES = [
  { scene: "Once upon a time…",    text: "Little Red Riding Hood lived in a wood with her mother.",                child: "Omer",  type: "narrative", pitch: 1.4,  rate: 1.0  },
  { scene: null,                   text: "One day Little Red Riding Hood went to visit her granny.",               child: "Araz",  type: "narrative", pitch: 1.2,  rate: 1.0  },
  { scene: null,                   text: "She had a nice cake in her basket.",                                     child: "Javid", type: "narrative", pitch: 1.5,  rate: 1.1  },
  { scene: null,                   text: "On her way Little Red Riding Hood met a wolf.",                          child: "Omer",  type: "narrative", pitch: 1.1,  rate: 0.95 },
  { scene: "In the deep forest…",  text: "“Hello! Where are you going?”",                                child: "Araz",  type: "wolf",      pitch: 0.8,  rate: 0.9  },
  { scene: null,                   text: "“I’m going to see my grandmother.”",                      child: "Amina", type: "lrrh",      pitch: 1.6,  rate: 1.05 },
  { scene: null,                   text: "“She lives in a house behind those trees.”",                   child: "Ayan",  type: "lrrh",      pitch: 1.5,  rate: 1.0  },
  { scene: "At Granny’s cottage…", text: "The wolf ran to Granny’s house and ate Granny up.",      child: "Javid", type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: null,                   text: "He got into Granny’s bed.",                                         child: "Omer",  type: "narrative", pitch: 1.4,  rate: 1.0  },
  { scene: null,                   text: "A little later, Little Red Riding Hood reached the house.",              child: "Omer",  type: "narrative", pitch: 1.15, rate: 1.0  },
  { scene: null,                   text: "She looked at the wolf.",                                                child: "Araz",  type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: "The big bad wolf…", text: "“Granny, what big eyes you have!”",                          child: "Amina", type: "lrrh",      pitch: 1.7,  rate: 1.1  },
  { scene: null,                   text: "“All the better to see you with!” said the wolf.",             child: "Javid", type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                   text: "“Granny, what big ears you have!”",                            child: "Ayan",  type: "lrrh",      pitch: 1.65, rate: 1.1  },
  { scene: null,                   text: "“All the better to hear you with!” said the wolf.",            child: "Omer",  type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                   text: "“Granny, what a big nose you have!”",                          child: "Amina", type: "lrrh",      pitch: 1.7,  rate: 1.0  },
  { scene: null,                   text: "“All the better to smell you with!” said the wolf.",           child: "Araz",  type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                   text: "“Granny, what big teeth you have!”",                           child: "Ayan",  type: "lrrh",      pitch: 1.6,  rate: 0.95 },

const CHILD_STYLES = {
  Ayan:  { cc: '#d81b60', label: '#fff' },
  Omer:  { cc: '#0057e7', label: '#fff' },
  Araz:  { cc: '#e65100', label: '#fff' },
  Javid: { cc: '#1b7e2e', label: '#fff' },
  Amina: { cc: '#7b1fa2', label: '#fff' },
};

/* ── Floating sparks ── */
(function() {
  const wrap   = document.getElementById('sparks');
  const glyphs = ['✦','★','✶','✸','⬟','◆'];
  const cols   = ['#e63946','#0057e7','#ffe100','#1b7e2e','#7b1fa2','#e65100'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = glyphs[i % glyphs.length];
    s.style.cssText = [
      `top:${Math.random() * 90}%`,
      `left:${Math.random() * 100}%`,
      `--sz:${(Math.random() * 1.2 + .7).toFixed(1)}rem`,
      `--op:${(Math.random() * .3 + .15).toFixed(2)}`,
      `--col:${cols[i % cols.length]}`,
      `--dur:${(Math.random() * 8 + 6).toFixed(1)}s`,
      `animation-delay:${(Math.random() * 8).toFixed(1)}s`,
    ].join(';');
    wrap.appendChild(s);
  }
})();

/* ── Build story ── */
const CARDS = [];
(function() {
  const story = document.getElementById('story');
  SENTENCES.forEach((s, i) => {
    if (s.scene) {
      if (i > 0) {
        const sep = document.createElement('div');
        sep.className = 'strip-sep';
        sep.innerHTML = '<span>★ ★ ★</span>';
        story.appendChild(sep);
      }
      const wrap = document.createElement('div');
      wrap.className = 'scene-wrap';
      const sc = document.createElement('div');
      sc.className = 'scene';
      sc.textContent = s.scene;
      wrap.appendChild(sc);
      story.appendChild(wrap);
    }

    const cs   = CHILD_STYLES[s.child] || { cc: '#e63946', label: '#fff' };
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = i;
    card.style.setProperty('--cc', cs.cc);

    card.innerHTML = `
      <div class="btn"><span>🔊</span></div>
      <div class="text">${s.text}</div>
      <div class="badge">${s.child}</div>
    `;
    card.addEventListener('click', () => {
      if (card === currentCard) { togglePlayPause(); return; }
      playFrom(i);
    });
    story.appendChild(card);
    CARDS.push(card);
  });
})();

/* ── Playback ── */
let currentAudio = null, currentCard = null, currentIdx = -1;
let isPlaying = false, isPaused = false;

const avatar    = document.getElementById('avatar');
const avatarImg = document.getElementById('avatarImg');
let _seq = 0;

function scrollThenAvatar(card, child, color) {
  const seq = ++_seq;
  avatarImg.src = `photos/${child.toLowerCase()}.jpg`;
  avatarImg.alt = child;
  avatar.style.borderColor = color;
  avatar.classList.remove('visible');

  const barH  = document.getElementById('player-bar').offsetHeight || 72;
  const cr    = card.getBoundingClientRect();
  window.scrollTo({ top: Math.max(0, window.scrollY + cr.top - (window.innerHeight - barH) / 2 + cr.height / 2), behavior: 'smooth' });

  const place = () => {
    if (seq !== _seq) return;
    const r = card.getBoundingClientRect();
    avatar.style.top = `${r.top + r.height / 2 - 31}px`;
    avatar.classList.add('visible');
  };
  if ('onscrollend' in window) window.addEventListener('scrollend', place, { once: true });
  setTimeout(place, 500);
}

function playFrom(idx) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentCard)  { currentCard.classList.remove('playing'); currentCard = null; }
  isPlaying = true; isPaused = false;
  playIndex(idx);
}

function togglePlayPause() {
  if (isPlaying && currentAudio) {
    currentAudio.pause();
    if (currentCard) currentCard.classList.remove('playing');
    isPlaying = false; isPaused = true; updateBar();
  } else if (isPaused && currentAudio) {
    if (currentCard) currentCard.classList.add('playing');
    isPlaying = true; isPaused = false;
    currentAudio.play(); updateBar();
  }
}

function playIndex(idx) {
  if (idx >= SENTENCES.length || !isPlaying) {
    isPlaying = false; isPaused = false; currentIdx = -1;
    if (currentCard) { currentCard.classList.remove('playing'); currentCard = null; }
    currentAudio = null; avatar.classList.remove('visible');
    updateBar(); return;
  }
  currentIdx = idx;
  const card = CARDS[idx], s = SENTENCES[idx];
  if (currentCard && currentCard !== card) currentCard.classList.remove('playing');
  currentCard = card;
  card.classList.add('playing');
  scrollThenAvatar(card, s.child, (CHILD_STYLES[s.child] || {}).cc || '#000');

  const audio = new Audio(`audio/sentence_${String(idx + 1).padStart(2, '0')}.mp3`);
  const advance = () => {
    if (audio !== currentAudio) return;
    card.classList.remove('playing'); card.classList.add('played');
    currentAudio = null; currentCard = null;
    if (isPlaying) playIndex(idx + 1);
  };
  audio.onended = advance; audio.onerror = advance;
  audio.play(); currentAudio = audio; updateBar();
}

function updateBar() {
  const idle     = document.getElementById('pb-idle');
  const active   = document.getElementById('pb-active');
  const pbChild  = document.getElementById('pb-child');
  const pbNum    = document.getElementById('pb-num');
  const pbText   = document.getElementById('pb-text');
  const pbToggle = document.getElementById('pb-toggle-btn');
  if ((isPlaying || isPaused) && currentIdx >= 0) {
    idle.style.display = 'none'; active.style.display = 'flex';
    const s = SENTENCES[currentIdx];
    pbChild.textContent = s.child.toUpperCase();
    pbChild.style.color = (CHILD_STYLES[s.child] || {}).cc || '#000';
    pbNum.textContent   = `${currentIdx + 1} / ${SENTENCES.length}`;
    const t = s.text;
    pbText.textContent  = t.length > 52 ? t.slice(0, 50) + '…' : t;
    pbToggle.innerHTML  = isPlaying ? '&#10074;&#10074;' : '&#9654;';
  } else {
    idle.style.display = 'flex'; active.style.display = 'none';
  }
}

document.getElementById('pb-play-btn').addEventListener('click', () => playFrom(0));
document.getElementById('pb-toggle-btn').addEventListener('click', togglePlayPause);
updateBar();

(function() {
  const grid    = document.getElementById('gallery-grid');
  const section = document.getElementById('gallery-section');
  if (!GALLERY_ITEMS.length) { section.style.display = 'none'; return; }

  GALLERY_ITEMS.forEach((item, i) => {
    const el  = document.createElement('div');
    el.className = 'g-item';
    const cap = item.caption ? `<div class="g-caption">${item.caption}</div>` : '';
    if (item.type === 'video') {
      el.innerHTML = `<video src="${item.src}" muted playsinline preload="metadata" style="pointer-events:none"></video>
        <div class="g-play"><div class="g-play-circle">&#9654;</div></div>${cap}`;
      const vid = el.querySelector('video');
      vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.001; });
    } else {
      el.innerHTML = `<img src="${item.src}" alt="${item.caption || ''}" loading="lazy">${cap}`;
    }
    el.addEventListener('click', () => openLightbox(i));
    grid.appendChild(el);
  });
})();

/* ── Lightbox ── */
let lbIndex = 0;
const lightbox = document.getElementById('lightbox');
const lbMedia  = document.getElementById('lb-media');
const lbVideo  = document.getElementById('lb-video');
const lbCap    = document.getElementById('lb-caption');

function openLightbox(i) {
  lbIndex = i; showLbItem();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  lbVideo.pause(); lbVideo.src = ''; lbMedia.src = '';
}
function showLbItem() {
  const item = GALLERY_ITEMS[lbIndex];
  lbCap.textContent = item.caption || '';
  lbVideo.pause();
  if (item.type === 'video') {
    lbMedia.style.display = 'none'; lbVideo.style.display = 'block';
    lbVideo.src = item.src; lbVideo.load();
  } else {
    lbVideo.style.display = 'none'; lbMedia.style.display = 'block';
    lbMedia.src = item.src;
  }
  document.getElementById('lb-prev').style.visibility = lbIndex > 0 ? 'visible' : 'hidden';
  document.getElementById('lb-next').style.visibility = lbIndex < GALLERY_ITEMS.length - 1 ? 'visible' : 'hidden';
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; showLbItem(); } });
document.getElementById('lb-next').addEventListener('click', () => { if (lbIndex < GALLERY_ITEMS.length - 1) { lbIndex++; showLbItem(); } });
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft'  && lbIndex > 0)                        { lbIndex--; showLbItem(); }
  if (e.key === 'ArrowRight' && lbIndex < GALLERY_ITEMS.length - 1) { lbIndex++; showLbItem(); }
});
</script>
