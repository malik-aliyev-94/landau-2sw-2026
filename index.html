<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Little Red Riding Hood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #0b1a0e;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Stars ── */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur, 2s) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: .2; transform: scale(.8); }
      to   { opacity: 1;  transform: scale(1.3); }
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 20px 24px;
    }
    .hero-emoji {
      display: block;
      width: clamp(200px, 50vw, 80vw);
      margin: 0 auto 12px;
      animation: float 3.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.2rem, 9vw, 4.5rem);
      line-height: 1.05;
      color: #ffd166;
      text-shadow: 3px 3px 0 #e63946, 6px 6px 0 rgba(0,0,0,.4);
      margin-bottom: 30px;
    }
    .subtitle {
      color: rgba(255,255,255,.6);
      font-size: .95rem;
      margin-top: 8px;
      font-style: italic;
    }

    /* ── Hint bar ── */
    .hint {
      position: relative;
      z-index: 1;
      text-align: center;
      margin: 0 20px 28px;
      padding: 10px 18px;
      background: rgba(255,255,255,.08);
      border-radius: 40px;
      color: rgba(255,255,255,.75);
      font-size: .88rem;
      backdrop-filter: blur(6px);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Story ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px 140px;
    }

    /* ── Scene dividers ── */
    .scene {
      text-align: center;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.45);
      margin: 32px 0 14px;
    }
    .scene::before, .scene::after {
      content: ' ✦ ';
      color: #ffd166;
    }

    /* ── Cards ── */
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      border-radius: 22px;
      /* right padding reserves space for the fixed avatar (62px + 14px offset) */
      /* padding: 18px 82px 22px 18px; */
      padding: 18px 82px 18px 22px;
      margin-bottom: 11px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      scroll-margin-bottom: 90px;
    }
    .card:active  { transform: scale(.96); }
    .card.playing { animation: glow .55s ease-in-out infinite alternate; }
    @keyframes glow {
      from { box-shadow: 0 4px 14px rgba(0,0,0,.35); transform: scale(1); }
      to   { box-shadow: 0 8px 32px rgba(255,255,255,.25); transform: scale(1.025); }
    }

    /* ── Speaker button ── */
    .btn {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: background .2s;
    }
    .card.playing .btn { animation: bump .55s ease-in-out infinite alternate; }
    @keyframes bump {
      from { transform: scale(1); }
      to   { transform: scale(1.18); }
    }

    /* ── Text ── */
    .text {
      flex: 1;
      font-size: clamp(.98rem, 3.5vw, 1.18rem);
      font-weight: 800;
      line-height: 1.55;
      color: #fff;
    }

    /* ── Child badge ── */
    .badge {
      position: absolute;
      top: 9px;
      right: 13px;
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.65);
    }

    /* Played checkmark */
    .card.played::after {
      content: '✓';
      position: absolute;
      bottom: 7px;
      right: 12px;
      font-size: .68rem;
      color: rgba(255,255,255,.45);
    }

    /* ── Trees ── */
    .trees {
      text-align: center;
      font-size: 1.6rem;
      margin: 6px 0 18px;
      opacity: .5;
      letter-spacing: .15em;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 16px 20px 36px;
      color: rgba(255,255,255,.35);
      font-size: .82rem;
    }

    /* ── Child avatar ── */
    #avatar {
      position: fixed;
      right: 14px;
      top: -80px;          /* starts off-screen */
      width: 62px;
      height: 62px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: top .45s cubic-bezier(.34,1.4,.64,1),
                  border-color .3s ease,
                  opacity .3s ease;
    }
    #avatar.visible { opacity: 1; }
    #avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (min-width: 520px) {
      .card { gap: 18px; }
      .btn  { width: 54px; height: 54px; font-size: 1.5rem; }
    }
    /* At 820px+ the card column is centered and the avatar sits to its right */
    @media (min-width: 820px) {
      .card { padding: 22px 26px 22px 26px; }
    }

    /* ── Gallery ── */
    #gallery-section {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px 140px;
    }
    .gallery-header {
      text-align: center;
      padding: 48px 0 8px;
    }
    .gallery-header h2 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      color: #ffd166;
      text-shadow: 2px 2px 0 #e63946, 4px 4px 0 rgba(0,0,0,.35);
    }
    .gallery-header p {
      color: rgba(255,255,255,.5);
      font-size: .9rem;
      font-style: italic;
      margin-top: 6px;
    }
    .gallery-divider {
      text-align: center;
      font-size: 1.4rem;
      opacity: .4;
      letter-spacing: .2em;
      margin: 18px 0 20px;
    }
    #gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 480px) {
      #gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    }
    .g-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1;
      cursor: pointer;
      background: rgba(255,255,255,.07);
      box-shadow: 0 4px 16px rgba(0,0,0,.45);
      transition: transform .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .g-item:active { transform: scale(.94); }
    @media (hover: hover) {
      .g-item:hover { transform: scale(1.04); box-shadow: 0 8px 28px rgba(0,0,0,.6); }
    }
    .g-item img,
    .g-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .g-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.32);
      font-size: 2.6rem;
      pointer-events: none;
    }
    .g-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 6px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,.72));
      color: rgba(255,255,255,.9);
      font-size: .68rem;
      font-weight: 700;
      line-height: 1.35;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.94);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #lightbox.open { display: flex; }
    #lb-media {
      max-width: min(92vw, 720px);
      max-height: 78vh;
      border-radius: 14px;
      display: block;
      object-fit: contain;
    }
    #lb-video {
      max-width: min(92vw, 720px);
      max-height: 78vh;
      border-radius: 14px;
      display: none;
      outline: none;
    }
    #lb-caption {
      color: rgba(255,255,255,.65);
      font-size: .86rem;
      margin-top: 14px;
      text-align: center;
      min-height: 1.2em;
      padding: 0 56px;
    }
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.14);
      border: none;
      color: #fff;
      font-size: 1.7rem;
      width: 46px; height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 510;
      backdrop-filter: blur(6px);
      transition: background .15s;
    }
    .lb-nav:hover { background: rgba(255,255,255,.26); }
    #lb-prev { left: 10px; }
    #lb-next { right: 10px; }
    #lb-close {
      position: fixed;
      top: 14px; right: 14px;
      background: rgba(255,255,255,.14);
      border: none;
      color: #fff;
      font-size: 1.3rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 510;
      backdrop-filter: blur(6px);
      transition: background .15s;
    }
    #lb-close:hover { background: rgba(255,255,255,.26); }

    /* ── Player bar ── */
    #player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 300;
      background: rgba(7, 16, 9, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,.1);
      padding: 0 16px env(safe-area-inset-bottom);
    }
    #pb-idle {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0;
    }
    #pb-play-btn {
      background: linear-gradient(135deg,#ffd166,#e63946);
      border: none;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 1.22rem;
      letter-spacing: .05em;
      padding: 13px 44px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(230,57,70,.45);
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #pb-play-btn:active { transform: scale(.95); box-shadow: 0 2px 8px rgba(230,57,70,.3); }
    #pb-active {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    #pb-info {
      flex: 1;
      min-width: 0;
    }
    #pb-child {
      display: block;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    #pb-text {
      display: block;
      font-size: .82rem;
      font-weight: 700;
      color: rgba(255,255,255,.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pb-num {
      flex-shrink: 0;
      font-size: .7rem;
      font-weight: 900;
      color: rgba(255,255,255,.38);
      white-space: nowrap;
    }
    #pb-toggle-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    #pb-toggle-btn:active { background: rgba(255,255,255,.26); }
  </style>
</head>
<body>

<div id="stars"></div>

<header>
  <img class="hero-emoji" src="images/intro.png" alt="Little Red Riding Hood">
  <h1>Little Red<br>Riding Hood</h1>
  <p class="subtitle">An interactive story</p>
  <p class="subtitle">LANDAU School &middot; Class 2SW &middot; 2026</p>
</header>

<div style="margin: 0 14px;">
  <p class="hint">👆 Tap a sentence to hear it read aloud!</p>
</div>

<main id="story"></main>

<footer>🌟 The End 🌟</footer>

<section id="gallery-section">
  <div class="gallery-header">
    <h2>📸 Behind the Scenes</h2>
    <p>The children who brought the story to life</p>
  </div>
  <div class="gallery-divider">🌲 🌳 🌲</div>
  <div id="gallery-grid"></div>
</section>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close">✕</button>
  <img id="lb-media" alt="">
  <video id="lb-video" controls playsinline></video>
  <p id="lb-caption"></p>
  <button class="lb-nav" id="lb-prev">&#8249;</button>
  <button class="lb-nav" id="lb-next">&#8250;</button>
</div>

<!-- Player bar -->
<div id="player-bar">
  <div id="pb-idle">
    <button id="pb-play-btn">&#9654;&nbsp;&nbsp;Play Story</button>
  </div>
  <div id="pb-active">
    <div id="pb-info">
      <span id="pb-child"></span>
      <span id="pb-text"></span>
    </div>
    <span id="pb-num"></span>
    <button id="pb-toggle-btn">&#10074;&#10074;</button>
  </div>
</div>

<div id="avatar"><img id="avatarImg" alt=""></div>

<script>
/* ── Story data ── */
const SENTENCES = [
  // scene, text, child, type, pitch, rate
  { scene: "Once upon a time…",      text: "Little Red Riding Hood lived in a wood with her mother.",                child: "Omer",      type: "narrative", pitch: 1.4,  rate: 1.0  },
  { scene: null,                     text: "One day Little Red Riding Hood went to visit her granny.",               child: "Araz",      type: "narrative", pitch: 1.2,  rate: 1.0  },
  { scene: null,                     text: "She had a nice cake in her basket.",                                     child: "Javid",     type: "narrative", pitch: 1.5,  rate: 1.1  },
  { scene: null,                     text: "On her way Little Red Riding Hood met a wolf.",                          child: "Omer",      type: "narrative", pitch: 1.1,  rate: 0.95 },
  { scene: "In the deep forest…",    text: "“Hello! Where are you going?”",                                          child: "Araz",      type: "wolf",      pitch: 0.8,  rate: 0.9  },
  { scene: null,                     text: "“I’m going to see my grandmother.”",                                     child: "Amina",     type: "lrrh",      pitch: 1.6,  rate: 1.05 },
  { scene: null,                     text: "“She lives in a house behind those trees.”",                             child: "Ayan",      type: "lrrh",      pitch: 1.5,  rate: 1.0  },
  { scene: "At Granny’s cottage…",   text: "The wolf ran to Granny’s house and ate Granny up.",                      child: "Javid",     type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: null,                     text: "He got into Granny’s bed.",                                              child: "Omer",      type: "narrative", pitch: 1.4,  rate: 1.0  },
  { scene: null,                     text: "A little later, Little Red Riding Hood reached the house.",              child: "Omer",      type: "narrative", pitch: 1.15, rate: 1.0  },
  { scene: null,                     text: "She looked at the wolf.",                                                child: "Araz",      type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: "The big bad wolf…",      text: "“Granny, what big eyes you have!”",                                      child: "Amina",     type: "lrrh",      pitch: 1.7,  rate: 1.1  },
  { scene: null,                     text: "“All the better to see you with!” said the wolf.",                       child: "Javid",     type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                     text: "“Granny, what big ears you have!”",                                      child: "Ayan",      type: "lrrh",      pitch: 1.65, rate: 1.1  },
  { scene: null,                     text: "“All the better to hear you with!” said the wolf.",                      child: "Omer",      type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                     text: "“Granny, what a big nose you have!”",                                    child: "Amina",     type: "lrrh",      pitch: 1.7,  rate: 1.0  },
  { scene: null,                     text: "“All the better to smell you with!” said the wolf.",                     child: "Araz",      type: "wolf",      pitch: 0.75, rate: 0.88 },
  { scene: null,                     text: "“Granny, what big teeth you have!”",                                     child: "Ayan",      type: "lrrh",      pitch: 1.6,  rate: 0.95 },
  { scene: null,                     text: "“All the better to eat you with!” shouted the wolf.",                    child: "Javid",     type: "wolf",      pitch: 0.7,  rate: 0.85 },
  { scene: "The rescue!",            text: "A woodcutter was in the wood.",                                          child: "Omer",      type: "narrative", pitch: 1.2,  rate: 1.05 },
  { scene: null,                     text: "He heard a loud scream and ran to the house.",                           child: "Araz",      type: "narrative", pitch: 1.1,  rate: 1.0  },
  { scene: null,                     text: "The woodcutter hit the wolf over the head.",                             child: "Javid",     type: "narrative", pitch: 1.45, rate: 1.1  },
  { scene: null,                     text: "The wolf opened his mouth wide and shouted and Granny jumped out.",      child: "Araz",      type: "narrative", pitch: 1.3,  rate: 1.0  },
  { scene: "Happily ever after…",    text: "The wolf ran away and Little Red Riding Hood never saw the wolf again.", child: "Javid",     type: "narrative", pitch: 1.5,  rate: 1.0  },
];

/* One colour identity per child — consistent across every card */
const CHILD_STYLES = {
  Ayan:  { bg: 'linear-gradient(135deg,#ff6b9d,#c9184a)', border: '#ff6b9d' },
  Omer:  { bg: 'linear-gradient(135deg,#48cae4,#1e6091)', border: '#48cae4' },
  Araz:  { bg: 'linear-gradient(135deg,#ff9f43,#c0392b)', border: '#ff9f43' },
  Javid: { bg: 'linear-gradient(135deg,#26de81,#0a6640)', border: '#26de81' },
  Amina: { bg: 'linear-gradient(135deg,#c77dff,#6a0dad)', border: '#c77dff' },
};

/* ── Build stars ── */
(function buildStars() {
  const el = document.getElementById('stars');
  const count = 70;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 1;
    s.style.cssText = [
      `width:${size}px`,
      `height:${size}px`,
      `top:${Math.random() * 35}%`,
      `left:${Math.random() * 100}%`,
      `--dur:${(Math.random() * 2 + 1.5).toFixed(1)}s`,
      `animation-delay:${(Math.random() * 3).toFixed(1)}s`,
    ].join(';');
    el.appendChild(s);
  }
})();

/* ── Build story ── */
const CARDS = [];
(function buildStory() {
  const story = document.getElementById('story');

  SENTENCES.forEach((s, i) => {
    if (s.scene) {
      if (i > 0) {
        const trees = document.createElement('div');
        trees.className = 'trees';
        trees.textContent = '🌲 🌳 🌲';
        story.appendChild(trees);
      }
      const sceneEl = document.createElement('div');
      sceneEl.className = 'scene';
      sceneEl.textContent = s.scene;
      story.appendChild(sceneEl);
    }

    const cs   = CHILD_STYLES[s.child] || { bg: '#555', border: '#999' };
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = i;
    card.style.background = cs.bg;

    card.innerHTML = `
      <div class="btn"><span class="btn-icon">🔊</span></div>
      <div class="text">${s.text}</div>
      <div class="badge">${s.child}</div>
    `;

    card.addEventListener('click', () => {
      if (card === currentCard) { togglePlayPause(); return; }
      playFrom(i);
    });
    story.appendChild(card);
    CARDS.push(card);
  });
})();

/* ── Playback state ── */
let currentAudio = null;
let currentCard  = null;
let currentIdx   = -1;
let isPlaying    = false;
let isPaused     = false;

const avatar    = document.getElementById('avatar');
const avatarImg = document.getElementById('avatarImg');

let _avatarSeq = 0;
function scrollThenAvatar(card, childName, borderColor) {
  const seq = ++_avatarSeq;

  avatarImg.src = `photos/${childName.toLowerCase()}.jpg`;
  avatarImg.alt = childName;
  avatar.style.borderColor = borderColor;
  avatar.classList.remove('visible'); // hide until scroll settles

  // Center the card in the space above the player bar
  const barH  = document.getElementById('player-bar').offsetHeight || 72;
  const availH = window.innerHeight - barH;
  const cr     = card.getBoundingClientRect();
  const targetY = Math.max(0, window.scrollY + cr.top - availH / 2 + cr.height / 2);
  window.scrollTo({ top: targetY, behavior: 'smooth' });

  const place = () => {
    if (seq !== _avatarSeq) return; // superseded by a newer sentence
    const r = card.getBoundingClientRect();
    avatar.style.top = `${r.top + r.height / 2 - 31}px`;
    avatar.classList.add('visible');
  };

  // scrollend fires the moment the animation finishes (Chrome 114+, Firefox 109+, Safari iOS 17.4+)
  if ('onscrollend' in window) {
    window.addEventListener('scrollend', place, { once: true });
  }
  // Fallback: card was already centered (no scroll → no scrollend), or older browser
  setTimeout(place, 500);
}

function stopAll() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentCard)  { currentCard.classList.remove('playing'); currentCard = null; }
  currentIdx = -1;
  isPlaying  = false;
  isPaused   = false;
  avatar.classList.remove('visible');
  updateBar();
}

function playFrom(idx) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentCard)  { currentCard.classList.remove('playing'); currentCard = null; }
  isPlaying = true;
  isPaused  = false;
  playIndex(idx);
}

function togglePlayPause() {
  if (isPlaying && currentAudio) {
    currentAudio.pause();
    if (currentCard) currentCard.classList.remove('playing');
    isPlaying = false;
    isPaused  = true;
    updateBar();
  } else if (isPaused && currentAudio) {
    if (currentCard) currentCard.classList.add('playing');
    isPlaying = true;
    isPaused  = false;
    currentAudio.play();
    updateBar();
  }
}

function playIndex(idx) {
  if (idx >= SENTENCES.length || !isPlaying) {
    isPlaying  = false;
    isPaused   = false;
    currentIdx = -1;
    if (currentCard) { currentCard.classList.remove('playing'); currentCard = null; }
    currentAudio = null;
    avatar.classList.remove('visible');
    updateBar();
    return;
  }
  currentIdx = idx;
  const card     = CARDS[idx];
  const sentence = SENTENCES[idx];
  if (currentCard && currentCard !== card) currentCard.classList.remove('playing');
  currentCard = card;
  card.classList.add('playing');
  const cs = CHILD_STYLES[sentence.child];
  scrollThenAvatar(card, sentence.child, (cs || {}).border || '#fff');
  const audio = new Audio(`audio/sentence_${String(idx + 1).padStart(2, '0')}.mp3`);
  const advance = () => {
    if (audio !== currentAudio) return;
    card.classList.remove('playing');
    card.classList.add('played');
    currentAudio = null;
    currentCard  = null;
    if (isPlaying) playIndex(idx + 1);
  };
  audio.onended = advance;
  audio.onerror = advance;
  audio.play();
  currentAudio = audio;
  updateBar();
}

function updateBar() {
  const idle      = document.getElementById('pb-idle');
  const active    = document.getElementById('pb-active');
  const pbChild   = document.getElementById('pb-child');
  const pbNum     = document.getElementById('pb-num');
  const pbText    = document.getElementById('pb-text');
  const pbToggle  = document.getElementById('pb-toggle-btn');
  if ((isPlaying || isPaused) && currentIdx >= 0) {
    idle.style.display   = 'none';
    active.style.display = 'flex';
    const s = SENTENCES[currentIdx];
    pbChild.textContent = s.child;
    pbChild.style.color = (CHILD_STYLES[s.child] || {}).border || '#fff';
    pbNum.textContent   = `${currentIdx + 1} / ${SENTENCES.length}`;
    const t = s.text;
    pbText.textContent  = t.length > 52 ? t.slice(0, 50) + '…' : t;
    pbToggle.innerHTML  = isPlaying ? '&#10074;&#10074;' : '&#9654;';
  } else {
    idle.style.display   = 'flex';
    active.style.display = 'none';
  }
}

document.getElementById('pb-play-btn').addEventListener('click', () => playFrom(0));
document.getElementById('pb-toggle-btn').addEventListener('click', togglePlayPause);
updateBar();

  { type: 'photo', src: 'gallery/photo_03.jpg', caption: '' },

  { type: 'photo', src: 'gallery/photo_002.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_003.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_004.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_005.jpg', caption: '' },
  { type: 'photo', src: 'gallery/photo_006.jpg', caption: '' },
  { type: 'video', src: 'gallery/video_01.mp4', caption: '' },
  { type: 'video', src: 'gallery/video_02.mp4', caption: '' },

  // { type: 'video', src: 'gallery/video_02.mp4', caption: '' },
  // { type: 'photo', src: 'gallery/photo_06.jpg', caption: '' },
];

(function buildGallery() {
  const grid    = document.getElementById('gallery-grid');
  const section = document.getElementById('gallery-section');
  if (!GALLERY_ITEMS.length) { section.style.display = 'none'; return; }

  GALLERY_ITEMS.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'g-item';
    const cap = item.caption ? `<div class="g-caption">${item.caption}</div>` : '';
    if (item.type === 'video') {
      el.innerHTML = `<video src="${item.src}" muted playsinline preload="metadata" style="pointer-events:none"></video>
        <div class="g-play">▶</div>${cap}`;
    } else {
      el.innerHTML = `<img src="${item.src}" alt="${item.caption || ''}" loading="lazy">${cap}`;
    }
    el.addEventListener('click', () => openLightbox(i));
    grid.appendChild(el);
  });
})();

/* ── Lightbox ── */
let lbIndex = 0;
const lightbox = document.getElementById('lightbox');
const lbMedia  = document.getElementById('lb-media');
const lbVideo  = document.getElementById('lb-video');
const lbCap    = document.getElementById('lb-caption');

function openLightbox(i) {
  lbIndex = i;
  showLbItem();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  lbVideo.pause();
  lbVideo.src  = '';
  lbMedia.src  = '';
}

function showLbItem() {
  const item = GALLERY_ITEMS[lbIndex];
  lbCap.textContent = item.caption || '';
  lbVideo.pause();
  if (item.type === 'video') {
    lbMedia.style.display = 'none';
    lbVideo.style.display = 'block';
    lbVideo.src = item.src;
    lbVideo.load();
  } else {
    lbVideo.style.display = 'none';
    lbMedia.style.display = 'block';
    lbMedia.src = item.src;
  }
  document.getElementById('lb-prev').style.visibility = lbIndex > 0 ? 'visible' : 'hidden';
  document.getElementById('lb-next').style.visibility = lbIndex < GALLERY_ITEMS.length - 1 ? 'visible' : 'hidden';
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; showLbItem(); } });
document.getElementById('lb-next').addEventListener('click', () => { if (lbIndex < GALLERY_ITEMS.length - 1) { lbIndex++; showLbItem(); } });
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft'  && lbIndex > 0)                           { lbIndex--; showLbItem(); }
  if (e.key === 'ArrowRight' && lbIndex < GALLERY_ITEMS.length - 1)    { lbIndex++; showLbItem(); }
});


</script>
